[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fde-api"
version = "0.3.0"
description = "FDE Workbench Flask API"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "requests>=2.34,<3",
  "boto3>=1.36,<2",
  "defusedxml==0.7.1",
  "cryptography>=46,<51",
  "qrcode==8.2",
  "pypdf>=6,<7",
  "openpyxl==3.1.5",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<24",
  "pydantic-settings>=2.7,<3",
  "oss2==2.19.1",
  "python-docx>=1.2,<2",
  "docxtpl>=0.18,<1",
  "bleach>=6,<7",
  "markdown-it-py==3.0.0",
  "playwright==1.58.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=6,<7",
  "freezegun>=1.5,<2"
]
dev = [
  "ruff>=0.17",
  "mypy>=1.11",
  "pre-commit>=3.8"
]

[tool.ruff]
line-length = 100
target-version = "py312"
# 静态基线只锁「会咬人」的一类：未使用导入（F401）与未使用局部变量（F841）。
# 其余规则（命名/文档字符串/复杂度）留待后续增量引入，不在本轮大范围改动代码。
[tool.ruff.lint]
select = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# 测试目录允许再导出 pytest fixture（跨文件复用 fixture 工厂）。
"tests/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = ["^\\.venv/", "^build/"]
# 存量错误走基线清单（mypy-baseline.txt），禁止用 ignore 隐藏新错误：
# 新增错误不在基线里 → mypy 失败。
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mysql_observer: requires a same-instance privileged MySQL observer for deterministic lock inspection and bounded cleanup",
  "oss: exercises the object-storage contract against the local adapter by default; real Aliyun OSS only when FDE_RUN_OSS_TESTS=1 and OSS credentials are supplied"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
