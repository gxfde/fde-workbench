# v0.2 (PG 迁移): MySQL 服务已移除 —— 数据库改为复用 WSL 里 Twenty 已有的
# PostgreSQL 16 实例（新增 fde_workbench 库 + 独立角色 fde），机器上数据库种类
# 从 3 种降为 2 种（SQLite=openfde / PostgreSQL=Twenty+fde_workbench），
# pg_dump 一套备份通吃。
#
# Redis 保留不动：实测该项目无 Celery（requirements.lock 无 celery），
# 后台任务是自研极简 Redis list 队列（jobs/queue.py）+ 登录限流 + 健康检查，
# 替换它等于制造第二处上游分叉，收益/风险比不划算。
#
# 网络：external = automation_qiflow-net（与 Twenty 同网，用 Docker DNS 的
#   twenty-db 别名连库，不依赖会变的容器 IP，也不改 Twenty 的任何配置）。
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # 不发布宿主端口：只有 api 容器经 docker 网络访问 redis（redis://redis:6379），
    # 免密码 Redis 暴露到 0.0.0.0 等于局域网可 FLUSHALL。
    volumes: ["fde_redis:/data"]
    networks:
      - automation_qiflow-net
    # I4：四个服务统一 restart 策略（此前 api/redis 缺失，容器挂了就再也不起）。
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      # 容器内用 Docker 网络别名（stable），而非 localhost；
      # DB 口令在仓库根 .env（gitignored）的 FDE_DB_PASSWORD，不进 VCS。
      FDE_DATABASE_URL: postgresql+psycopg://fde:${FDE_DB_PASSWORD:?FDE_DB_PASSWORD missing in .env}@twenty-db:5432/fde_workbench
      FDE_REDIS_URL: redis://redis:6379/0
      FDE_API_HOST: 0.0.0.0
      FDE_API_PORT: "8010"
    ports:
      # 只绑回环：桌面端/采集器都连 127.0.0.1，不对局域网开放（登录无限流）。
      - "127.0.0.1:8010:8010"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - automation_qiflow-net
    volumes:
      - fde_storage:/app/.fde-storage
      - fde_transcript_drafts:/app/.fde-transcript-drafts  # T-A9 草稿独立根（与 fde_storage 分卷）
      # 把 migrations 目录挂出来：alembic revision 生成的迁移文件在容器内，
      # 挂载后宿主机可直接看到并纳入 git（否则生成物会随容器销毁）
      - ./server/migrations:/app/migrations
    healthcheck:
      # I4：走 /ready（校验数据库与 Redis 就绪）而不是 /ready 之前用的 /live
      # ——/live 只证明进程活着，DB 挂了容器照样 healthy。
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/api/v1/health/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # I4：统一 restart 策略（此前 api 无 restart，容器退出后不再起）。
    restart: unless-stopped

  worker:
    # v0.3: 补齐后台任务执行器。
    # 此前 compose 只有 api，而所有后台任务（ai.chat / document.generate /
    # file.scan / file.preview / project.presurvey.analyze / research.export /
    # automation.execute）都靠 `flask worker` 消费 Redis 队列。没有 worker 时
    # 事件只写进 outbox_events 且永远停在 pending —— 表现是前端一直显示
    # 「正在排队…」，而数据库里 background_jobs 是空表。
    # 注意：worker 不监听端口，只跑容器内循环。
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      FDE_DATABASE_URL: postgresql+psycopg://fde:${FDE_DB_PASSWORD:?FDE_DB_PASSWORD missing in .env}@twenty-db:5432/fde_workbench
      FDE_REDIS_URL: redis://redis:6379/0
      FDE_API_HOST: 0.0.0.0
      FDE_API_PORT: "8010"
    command: ["flask", "--app", "fde_api.wsgi:app", "worker"]
    restart: unless-stopped
    # I4：worker 不监听端口，「进程还在」不等于「还在干活」。循环每轮写一次
    # Redis 心跳（fde:health:worker，TTL 180s）；卡死时心跳不再刷新，
    # healthcheck 判 unhealthy。
    healthcheck:
      test: ["CMD", "python", "-m", "fde_api.health.heartbeat", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - automation_qiflow-net
    volumes:
      - fde_storage:/app/.fde-storage
      - fde_transcript_drafts:/app/.fde-transcript-drafts  # T-A9 草稿独立根（与 fde_storage 分卷）

  scheduler:
    # v0.3: 自动化调度器。与 worker 分开：worker 只消费已入队的事件，
    # 定时触发 automation.execute 靠 scheduler 周期性扫描到期任务。
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      FDE_DATABASE_URL: postgresql+psycopg://fde:${FDE_DB_PASSWORD:?FDE_DB_PASSWORD missing in .env}@twenty-db:5432/fde_workbench
      FDE_REDIS_URL: redis://redis:6379/0
      FDE_API_HOST: 0.0.0.0
      FDE_API_PORT: "8010"
    command: ["flask", "--app", "fde_api.wsgi:app", "scheduler"]
    restart: unless-stopped
    # I4：同 worker——心跳键 fde:health:scheduler（TTL 900s，覆盖最大 300s 间隔）。
    healthcheck:
      test: ["CMD", "python", "-m", "fde_api.health.heartbeat", "scheduler"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - automation_qiflow-net
    volumes:
      - fde_storage:/app/.fde-storage
      - fde_transcript_drafts:/app/.fde-transcript-drafts  # T-A9 草稿独立根（与 fde_storage 分卷）

  sandbox-runner:
    # goal-d3（技术实施方案 §4 / 决议 D4）：agent 执行沙箱基座。
    # 技术文档原文照落：privileged=false、默认断网（network_mode: none）、
    # 一次性 tmpfs workspace；per-run 容器由服务端 agents/sandbox.py 经
    # docker CLI 按独立容器拉起（--name agent-run-{run_id}），本服务承载
    # 镜像构建与运行时基线。
    # profiles=["sandbox"]：默认 `docker compose up -d` 不启动它（试点 gate
    # d6 才随开关启用），需要时 `docker compose --profile sandbox up -d`。
    build: ./docker/sandbox
    image: fde-sandbox-runner:latest
    profiles:
      - sandbox
    privileged: false
    network_mode: none
    tmpfs:
      - /workspace:size=512m
    # 断网空闲基座：常驻无意义，随 profile 显式启停；默认命令仅保活，
    # 便于 --profile sandbox up 后 inspect 验证基线配置。
    command: ["sleep", "infinity"]
    restart: "no"

networks:
  automation_qiflow-net:
    external: true

volumes:
  fde_redis:
  fde_storage:
  fde_transcript_drafts:
