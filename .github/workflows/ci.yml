# B1 CI：与本地命令一致——PG service → pytest → ruff/mypy 基线 → 代号化验收
# → desktop typecheck + vitest。核心步骤无 continue-on-error。
#
# 服务端测试走隔离测试库 fde_workbench_test（conftest 双重断言：库名必须
# *_test，且整个会话持 advisory lock 串行化）；冒烟脚本经 pytest 自动入口
# 在同一隔离库执行（B6），口令随机生成（C11）；代号化验收扫的是 CI 自己的
# service 库 + 合成黑名单 fixture（B7），绝不触碰任何开发/生产库。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# 同一 ref 有新 run 排队时取消未完成的旧 run：连续 push 只验证最终态。
# 各分支/PR 的 ref 互不同组，互不误伤。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    # 钉具体镜像（ubuntu-latest 会随 GitHub 静默迁移大版本，2026-10 已发生过一次）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: fde_workbench_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U fde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FDE_TEST_DATABASE_URL: postgresql+psycopg://fde:ci-postgres@127.0.0.1:15432/fde_workbench_test
      FDE_TEST_REDIS_URL: redis://127.0.0.1:16379/2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # 下载缓存按 requirements.lock 哈希键控：lock 不变即命中
          cache: pip
          cache-dependency-path: server/requirements.lock

      - name: Install server dependencies (test + dev extras)
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # 先装 lock 再叠 extras：extras 的传递依赖被钉进 lock 版本，上游发版
          # 不再能零改动翻红。不能用 -c 约束——lock 含 psycopg[binary] 这类
          # 带 extras 的条目，新版 pip 直接拒绝（Constraints cannot have extras）。
          .venv/bin/python -m pip install -r requirements.lock -e ".[test,dev]"

      - name: ruff (F401/F841 unused imports & variables)
        working-directory: server
        run: .venv/bin/python -m ruff check --select F401,F841 src tests

      - name: archify diagram freshness (图纸口径防陈旧闸)
        # 图纸里的「N 蓝图 / N 路由 / N 表 / N 迁移」必须与机器可读结构口径
        # docs/audit/v3-workbench-inventory.json 逐项一致——否则结构变了图没变，
        # 而没有任何机器能发现（架构评估 P2-7）。stdlib only，无需额外依赖。
        working-directory: server
        run: .venv/bin/python ../scripts/audit/check_archify_diagram_freshness.py

      - name: mypy (baseline + no new errors)
        run: python scripts/check-python-types.py

      - name: pytest (isolated PostgreSQL test database)
        working-directory: server
        # 并行跑测（架构评估 P1-3）：`-n 4 --dist loadfile` 把 2348 例的墙钟
        # 从 1 小时量级压到分钟量级。**每个 worker 一个独立测试库**
        # （conftest 按 PYTEST_XDIST_WORKER 派生 fde_workbench_w{N}_test；
        # CI 的 postgres:16 里 POSTGRES_USER=fde 是超级用户，天然有建库权限）——
        # 否则并发 worker 的每用例 DELETE-all 清库与会话级 advisory lock 会
        # 互相踩踏（那是「慢」与「不可信的绿」的区别）。
        # --dist loadfile：同一文件内的用例留在同一 worker，保住文件内顺序语义。
        run: PYTHONPATH=src .venv/bin/python -m pytest -q -n 4 --dist loadfile

  pseudonymization:
    # B7：代号化验收。扫 CI 自己的 service 库（合成数据），黑名单来自
    # 仓库内的合成 fixture（FDE_LEADS_MD 显式传入），并先跑 --self-test
    # 证明扫描器灵敏度（没自测过的校验器等于没有校验器）。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: server-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fde
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: fde_workbench_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U fde"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # T-A2（闸②拍板：仓库内种子文件为单一真源）——黑名单直接指向
      # server/seeds/enterprise-names.txt，与入库替换词典同源；哨兵测试
      # （test_enterprise_dict_parity）钉死两边读的是同一个文件。
      FDE_LEADS_MD: ${{ github.workspace }}/server/seeds/enterprise-names.txt
    steps:
      - uses: actions/checkout@v4

      # I5（goal-r2/WP25）：旧 job 只在空库上跑 --self-test 就收工——正式扫描
      # 扫的是未迁移未灌数据的空库，「0 行 0 命中」是 C-8b 假绿。现在先迁移
      # 到 head 并灌合成业务数据，扫描脚本的 check_code_format 会断言
      # projects 行数 > 0（空库直接 FAIL），闭合「真的扫到了」的证据链。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.lock

      - name: Install server dependencies (alembic + driver for migration/seed)
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.lock -e .

      - name: Resolve service container
        run: |
          set -euo pipefail
          # 双重确认是本 job 的 service 库：ancestor 只能保证镜像相同，再加
          # POSTGRES_DB 环境指纹（service 容器唯一携带 fde_workbench_test）。
          # 不用 --filter name=：GitHub runner 的 service 容器命名无文档保证，
          # 钉一个没验证过的名字模式等于制造新的盲雷。
          container="$(
            for id in $(docker ps --filter ancestor=postgres:16 --format '{{.ID}}'); do
              if docker inspect "$id" --format '{{range .Config.Env}}{{println .}}{{end}}' \
                  | grep -qx 'POSTGRES_DB=fde_workbench_test'; then
                echo "$id"
                break
              fi
            done
          )"
          [ -n "$container" ] || { echo "postgres service container not found"; exit 1; }
          echo "FDE_PG_CONTAINER=$container" >> "$GITHUB_ENV"

      - name: Apply migrations and seed synthetic business data
        working-directory: server
        env:
          FDE_DATABASE_URL: postgresql+psycopg://fde:ci-postgres@127.0.0.1:15432/fde_workbench_test
          # Settings() 必填项：本步骤不真用 Redis、JWT 只为通过校验，哑值即可
          FDE_REDIS_URL: redis://localhost:6379/0
          FDE_JWT_SECRET: ci-only-pseudonymization-job-dummy-secret-0123456789abcdef
          # load_seeds 导入 fde_api（复用 conftest 的引用种子灌入逻辑）
          PYTHONPATH: src
        run: |
          set -euo pipefail
          .venv/bin/python -m alembic upgrade head
          .venv/bin/python - <<'PY'
          import os
          import sys

          from sqlalchemy import create_engine, text
          from sqlalchemy.orm import Session

          sys.path.insert(0, ".")
          from load_seeds import _upsert_module_catalog, _upsert_sop_nodes

          engine = create_engine(os.environ["FDE_DATABASE_URL"])
          with Session(engine) as session, session.begin():
              # projects.sop_phase 外键指向 sop_nodes——迁移只建表，引用种子须同批灌入
              _upsert_sop_nodes(session)
              _upsert_module_catalog(session)
              session.execute(
                  text(
                      "insert into users (id, username, display_name, role, password_hash,"
                      " must_change_password, is_active)"
                      " values ('00000000-0000-0000-0000-00000000lead', 'ci-pseudonym-seed',"
                      " 'CI 代号化种子', 'admin', 'seed-not-a-real-hash', false, true)"
                      " on conflict (username) do nothing"
                  )
              )
              for i in range(1, 4):
                  session.execute(
                      text(
                          "insert into projects (id, project_code, name, enterprise_code,"
                          " leader_user_id, background, notes, status, business_line,"
                          " planned_start_date, template_snapshot, research_snapshot)"
                          " values (:id, :code, :name, :ent, :leader, '', '', 'draft', 'FDE',"
                          " :start, '{}'::json, '{}'::json)"
                          " on conflict (project_code) do nothing"
                      ),
                      {
                          "id": f"00000000-0000-0000-0000-00000000000{i}",
                          "code": f"CI-SEED-{i}",
                          "name": f"代号化扫描种子项目{i}",
                          "ent": f"种子客户{i}·制造业·苏州",
                          "leader": "00000000-0000-0000-0000-00000000lead",
                          "start": "2026-01-01",
                      },
                  )
              count = session.execute(text("select count(*) from projects")).scalar_one()
              assert count >= 3, f"synthetic seed failed: projects={count}"
              print(f"seed ok: projects={count}")
          PY

      - name: Run the check (self-test, then scan migrated + seeded database)
        env:
          FDE_PG_USER: fde
          FDE_PG_DB: fde_workbench_test
        run: |
          set -euo pipefail
          # 合成黑名单里的名字必须出现在库里才会命中——先注入哨兵行证明
          # 扫描器抓得到（抓不到 = 扫描器坏了），再清理重扫；正式扫描跑在
          # 已迁移已灌数据的库上，projects 行数 > 0 由脚本自身断言（I5）。
          bash scripts/check-pseudonymization.sh --self-test

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # workspaces 共享根锁，缓存按 package-lock.json 哈希键控
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: typecheck (renderer + renderer tests, zero error)
        run: npx tsc -p desktop/tsconfig.web.json --noEmit

      - name: vitest (desktop, serial)
        run: npm --workspace desktop test

  secrets-scan:
    # P3-8：gitleaks 入 CI。push 扫全历史、PR 只扫增量提交；本仓库全历史
    # 基线实测无泄漏（46 commits，2026-10-26）。
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
